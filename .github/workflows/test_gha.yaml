on:
  workflow_dispatch:
    inputs:
      season_rebuild:
        description: 'Rebuild Season (9999 defaults to latest season). Do multiple seasons comma separated, e.g. 2017,2019,2021'
        required: false
        default: 9999
        type: number
      full_rebuild:
        description: 'Full Rebuild (overwrites above season)'
        required: true
        default: false
        type: boolean

name: GHA test

jobs:
  gha_test:
    runs-on: ubuntu-latest

    env:
      SEASON_REBUILD: ${{ inputs.season_rebuild || 9999 }}

    steps:

      - name: Debug Season Input
        run: |
          printf 'SEASON_REBUILD=<%s>\n' "$SEASON_REBUILD"
          printf 'SEASON_REBUILD bytes: '
          printf '%s' "$SEASON_REBUILD" | od -An -t x1
          printf 'Raw event input:\n'
          jq '.inputs.season_rebuild' "$GITHUB_EVENT_PATH"
