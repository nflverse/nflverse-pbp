on:
  push:
    branches: [master]
    paths:
      - "DESCRIPTION"
      - "docker/Dockerfile"
      - ".github/workflows/build_image.yaml"
  # build only (no push) to verify changes before they land on master
  pull_request:
    paths:
      - "DESCRIPTION"
      - "docker/Dockerfile"
      - ".github/workflows/build_image.yaml"
  schedule:
  # Weekly rebuild (Tuesday 7:00 UTC) to pick up new R and CRAN package
  # releases. nflverse packages are refreshed in every update_data job anyways.
   - cron: '0 7 * * 2'
  workflow_dispatch:

name: Build Update Image

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # always start fresh, otherwise cached layers keep old packages
          no-cache: true
          pull: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
