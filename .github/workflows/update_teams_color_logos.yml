on:
  workflow_dispatch:
  push:
    paths: ["teams_colors_logos.csv"]

name: Update Teams
permissions: read-all

jobs:
  update_teams:
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    steps:
      # Checkout + nflverse packages at their latest commit
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflreadr nflverse/nflverse-data

      - name: Release teams data
        run: Rscript -e 'source("exec/update_teams_colors_logos.R")'
        env:
          # used by the gh cli for release uploads. Set only here so the
          # setup step, which installs unpinned GitHub code, never sees it.
          GH_TOKEN: ${{ secrets.NFLVERSE_GH_TOKEN }}
