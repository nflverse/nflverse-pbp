on:
  workflow_dispatch:
  push:
    paths: ["teams_colors_logos.csv"]

name: Update Teams
permissions: read-all

jobs:
  update_teams:
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    steps:
      # Checkout + nflverse packages at their latest commit
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflreadr nflverse/nflverse-data

      # write access to the teams release in nflverse-data only. Minted after
      # setup, which installs unpinned GitHub code.
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data
          contents: write

      - name: Release teams data
        run: Rscript -e 'source("exec/update_teams_colors_logos.R")'
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
