on:
  schedule:
  # Every day at 9:00 UTC/5:00 ET
   - cron:  '3 9 * 1,2,9-12 *'
  # TNF 5:30 AM UTC / 12:30 AM ET
   - cron:  '33 5 * 1,2,9-12 5'
  # Early window: 10:00 PM UTC / 5:00 PM ET
   - cron:  '3 22 * 1,2,9-12 0'
  # Late window: 0:00 UTC / 8:00 ET
   - cron:  '7 0 * 1,2,9-12 1'
  # SNF/MNF: 5:30 UTC / 12:30 ET
   - cron:  '33 5 * 1,2,9-12 1'
   - cron:  '33 5 * 1,2,9-12 2'
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Which data to update. "stats" needs current pbp and play stats in the releases.'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pbp
          - pbp_stats
          - stats
      season_rebuild:
        description: 'Rebuild Season (9999 defaults to latest season). Do multiple seasons comma separated, e.g. 2017,2019,2021'
        required: false
        default: '9999'
        type: string
      full_rebuild:
        description: 'Full Rebuild (overwrites above season)'
        required: true
        default: false
        type: boolean

name: Update PBP Related Data

# Never run two updates at the same time. A scheduled run that fires during a
# long rebuild waits instead of doubling the upload load on the GitHub API.
concurrency:
  group: update-pbp-data
  cancel-in-progress: false

jobs:
  pbp_setup:
    runs-on: ubuntu-latest
    name: pbp_setup
    outputs:
      seasons: ${{ steps.seasons.outputs.seasons }}
      pbp_types: ${{ steps.datasets.outputs.pbp_types }}
      run_stats: ${{ steps.datasets.outputs.run_stats }}
      releases: ${{ steps.datasets.outputs.releases }}
      started_at: ${{ steps.datasets.outputs.started_at }}
    steps:
      - id: seasons
        uses: nflverse/actions/season-matrix@v1
        with:
          first-season: 2001
          season-rebuild: ${{ inputs.season_rebuild }}
          full-rebuild: ${{ inputs.full_rebuild }}

      - id: datasets
        name: Query datasets
        env:
          DATASETS: ${{ inputs.datasets || 'all' }}
        run: |
          set -euo pipefail

          # used by the upload_timestamps job to find releases this run updated
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          # "owner/repo tag" of every release this run writes to, for the
          # upload_timestamps job
          case "$DATASETS" in
            # pbp and pbp_stats share one job per season so the raw game
            # files are downloaded only once
            all)       pbp_types='["pbp,pbp_stats"]'; run_stats=true
                       releases=("nflverse/nflverse-data pbp" "nflverse/nflverse-pbp playstats"
                                 "nflverse/nflverse-data stats_player" "nflverse/nflverse-data stats_team") ;;
            pbp)       pbp_types='["pbp"]';           run_stats=false
                       releases=("nflverse/nflverse-data pbp") ;;
            pbp_stats) pbp_types='["pbp_stats"]';     run_stats=false
                       releases=("nflverse/nflverse-pbp playstats") ;;
            stats)     pbp_types='[]';                run_stats=true
                       releases=("nflverse/nflverse-data stats_player" "nflverse/nflverse-data stats_team") ;;
            *) echo "::error::Unknown datasets value '$DATASETS'"; exit 1 ;;
          esac

          echo "pbp jobs: $pbp_types | stats: $run_stats"
          {
            echo "pbp_types=$pbp_types"
            echo "run_stats=$run_stats"
            echo "releases<<RELEASES_EOF"
            printf '%s\n' "${releases[@]}"
            echo "RELEASES_EOF"
          } >> "$GITHUB_OUTPUT"

  update_pbp:
    needs: pbp_setup
    if: needs.pbp_setup.outputs.pbp_types != '[]'
    name: Update ${{ matrix.season }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    strategy:
      fail-fast: false
      # Many jobs uploading release assets at the same moment trip GitHub's
      # secondary rate limit. Limit how many seasons run at once.
      max-parallel: 6
      matrix:
        season: ${{ fromJson(needs.pbp_setup.outputs.seasons) }}
        type: ${{ fromJson(needs.pbp_setup.outputs.pbp_types) }}
    env:
      NFLVERSE_UPDATE_SEASON: ${{ matrix.season }}
      NFLVERSE_UPDATE_TYPE: ${{ matrix.type }}
      # timestamps are uploaded once per run by the upload_timestamps job
      NFLVERSE_UPLOAD_TIMESTAMPS: "false"
    steps:
      # Checkout + nflverse packages at their latest commit. The data must be
      # built with their latest versions.
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflfastR nflverse/nflreadr nflverse/nflverse-data
      # write access to the releases in nflverse-data (pbp, stats_player,
      # stats_team) and nflverse-pbp (playstats) only. Minted after setup,
      # which installs unpinned GitHub code.
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data, nflverse-pbp
          contents: write
      - name: Release ${{ matrix.type }}
        run: Rscript -e 'source("exec/update_data.R")'
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}

  update_stats:
    needs: [pbp_setup, update_pbp]
    # Run after a successful pbp update, or directly if pbp jobs were skipped
    # (datasets == "stats")
    if: >-
      !cancelled() &&
      needs.pbp_setup.outputs.run_stats == 'true' &&
      (needs.update_pbp.result == 'success' || needs.update_pbp.result == 'skipped')
    name: Update ${{ matrix.season }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    strategy:
      fail-fast: false
      # stats uploads 8 datasets per season. More than 4 seasons uploading at
      # once tripped GitHub's secondary rate limit in the past.
      max-parallel: 4
      matrix:
        season: ${{ fromJson(needs.pbp_setup.outputs.seasons) }}
        type: ["stats"]
    env:
      NFLVERSE_UPDATE_SEASON: ${{ matrix.season }}
      NFLVERSE_UPDATE_TYPE: ${{ matrix.type }}
      # timestamps are uploaded once per run by the upload_timestamps job
      NFLVERSE_UPLOAD_TIMESTAMPS: "false"
    steps:
      # Checkout + nflverse packages at their latest commit. The data must be
      # built with their latest versions.
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflfastR nflverse/nflreadr nflverse/nflverse-data
      # write access to the releases in nflverse-data (pbp, stats_player,
      # stats_team) and nflverse-pbp (playstats) only. Minted after setup,
      # which installs unpinned GitHub code.
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data, nflverse-pbp
          contents: write
      - name: Release ${{ matrix.type }}
        run: Rscript -e 'source("exec/update_data.R")'
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}

  # Upload timestamp.txt and timestamp.json once per release instead of once per
  # matrix job. A release gets a new timestamp if at least one of its data files
  # was updated during this run, i.e. at least one job for it succeeded.
  upload_timestamps:
    needs: [pbp_setup, update_pbp, update_stats]
    if: ${{ !cancelled() && needs.pbp_setup.result == 'success' }}
    name: Upload release timestamps
    runs-on: ubuntu-latest
    steps:
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data, nflverse-pbp
          contents: write
      - uses: nflverse/actions/upload-timestamps@v1
        with:
          started-at: ${{ needs.pbp_setup.outputs.started_at }}
          releases: ${{ needs.pbp_setup.outputs.releases }}
          token: ${{ steps.upload-token.outputs.token }}
