on:
  schedule:
  # Every day at 9:00 UTC/5:00 ET
   - cron:  '3 9 * 1,2,9-12 *'
  # TNF 5:30 AM UTC / 12:30 AM ET
   - cron:  '33 5 * 1,2,9-12 5'
  # Early window: 10:00 PM UTC / 5:00 PM ET
   - cron:  '3 22 * 1,2,9-12 0'
  # Late window: 0:00 UTC / 8:00 ET
   - cron:  '7 0 * 1,2,9-12 1'
  # SNF/MNF: 5:30 UTC / 12:30 ET
   - cron:  '33 5 * 1,2,9-12 1'
   - cron:  '33 5 * 1,2,9-12 2'
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Which data to update. "stats" needs current pbp and play stats in the releases.'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pbp
          - pbp_stats
          - stats
      season_rebuild:
        description: 'Rebuild Season (9999 defaults to latest season). Do multiple seasons comma separated, e.g. 2017,2019,2021'
        required: false
        default: '9999'
        type: string
      full_rebuild:
        description: 'Full Rebuild (overwrites above season)'
        required: true
        default: false
        type: boolean

name: Update PBP Related Data

# Never run two updates at the same time. A scheduled run that fires during a
# long rebuild waits instead of doubling the upload load on the GitHub API.
concurrency:
  group: update-pbp-data
  cancel-in-progress: false

jobs:
  pbp_setup:
    runs-on: ubuntu-latest
    name: pbp_setup
    env:
      FULL_REBUILD: ${{ inputs.full_rebuild || false }}
      SEASON_REBUILD: ${{ inputs.season_rebuild || '9999' }}
      DATASETS: ${{ inputs.datasets || 'all' }}
    outputs:
      seasons: ${{ steps.query_seasons.outputs.seasons }}
      pbp_types: ${{ steps.query_seasons.outputs.pbp_types }}
      run_stats: ${{ steps.query_seasons.outputs.run_stats }}
      started_at: ${{ steps.query_seasons.outputs.started_at }}
    steps:
      # Plain bash + jq (both preinstalled on the runner), no R setup needed.
      # Season logic mirrors nflverse.workflows::get_current_season(): the new
      # season starts on the Wednesday after Labor Day (first Monday in Sept).
      - id: query_seasons
        name: Query Seasons
        run: |
          set -euo pipefail

          # used by the upload_timestamps job to find releases this run updated
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          year=$(date -u +%Y)
          sep1_dow=$(date -u -d "$year-09-01" +%u) # 1 = Monday ... 7 = Sunday
          labor_day=$(date -u -d "$year-09-01 +$(( (8 - sep1_dow) % 7 )) days" +%F)
          season_opener=$(date -u -d "$labor_day +2 days" +%Y%m%d)
          if [ "$(date -u +%Y%m%d)" -ge "$season_opener" ]; then
            current_season=$year
          else
            current_season=$((year - 1))
          fi

          # strip whitespace, e.g. "2017, 2019"
          season_input="${SEASON_REBUILD//[[:space:]]/}"

          if [ "$FULL_REBUILD" == "true" ]; then
            seasons=$(jq -cn --argjson to "$current_season" '[range(2001; $to + 1)]')

          elif [ -z "$season_input" ] || [[ "$season_input" =~ ^9999(\.0+)?$ ]]; then
            seasons="[$current_season]"

          else
            # Accepts "2017,2019,2021" as well as "2017.0" (mobile app input).
            # Fails the job on anything that isn't a valid season.
            seasons=$(jq -cn --arg s "$season_input" --argjson to "$current_season" '
              $s | split(",") | map(select(length > 0) | sub("\\.0+$"; "") | tonumber)
              | if length > 0 and all(. == floor and . >= 2001 and . <= $to)
                then unique
                else error("Invalid season input: \($s). Allowed: 2001-\($to)")
                end')
          fi

          case "$DATASETS" in
            # pbp and pbp_stats share one job per season so the raw game
            # files are downloaded only once
            all)       pbp_types='["pbp,pbp_stats"]';   run_stats=true  ;;
            pbp)       pbp_types='["pbp"]';             run_stats=false ;;
            pbp_stats) pbp_types='["pbp_stats"]';       run_stats=false ;;
            stats)     pbp_types='[]';                  run_stats=true  ;;
            *) echo "::error::Unknown datasets value '$DATASETS'"; exit 1 ;;
          esac

          echo "Seasons: $seasons | pbp jobs: $pbp_types | stats: $run_stats"
          {
            echo "seasons=$seasons"
            echo "pbp_types=$pbp_types"
            echo "run_stats=$run_stats"
          } >> "$GITHUB_OUTPUT"

  update_pbp:
    needs: pbp_setup
    if: needs.pbp_setup.outputs.pbp_types != '[]'
    name: Update ${{ matrix.season }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Many jobs uploading release assets at the same moment trip GitHub's
      # secondary rate limit. Limit how many seasons run at once.
      max-parallel: 6
      matrix:
        season: ${{ fromJson(needs.pbp_setup.outputs.seasons) }}
        type: ${{ fromJson(needs.pbp_setup.outputs.pbp_types) }}
    env:
      # used by the gh cli for release uploads
      GH_TOKEN: ${{ secrets.NFLVERSE_GH_TOKEN }}
      # pak reads GITHUB_PAT to resolve GitHub packages. Without it pak uses the
      # public "bundled" PAT. Use this repo's own token so package installs
      # don't eat into the rate limits of the upload token.
      GITHUB_PAT: ${{ github.token }}
      NFLVERSE_UPDATE_SEASON: ${{ matrix.season }}
      NFLVERSE_UPDATE_TYPE: ${{ matrix.type }}
      # timestamps are uploaded once per run by the upload_timestamps job
      NFLVERSE_UPLOAD_TIMESTAMPS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://nflverse.r-universe.dev'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            nflverse/nflverse-data
            nflverse/fastrmodels
      - name: Release ${{ matrix.type }}
        run: Rscript -e 'source("exec/update_data.R")'

  update_stats:
    needs: [pbp_setup, update_pbp]
    # Run after a successful pbp update, or directly if pbp jobs were skipped
    # (datasets == "stats")
    if: >-
      !cancelled() &&
      needs.pbp_setup.outputs.run_stats == 'true' &&
      (needs.update_pbp.result == 'success' || needs.update_pbp.result == 'skipped')
    name: Update ${{ matrix.season }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # stats uploads 8 datasets per season. More than 4 seasons uploading at
      # once tripped GitHub's secondary rate limit in the past.
      max-parallel: 4
      matrix:
        season: ${{ fromJson(needs.pbp_setup.outputs.seasons) }}
        type: ["stats"]
    env:
      GH_TOKEN: ${{ secrets.NFLVERSE_GH_TOKEN }}
      GITHUB_PAT: ${{ github.token }}
      NFLVERSE_UPDATE_SEASON: ${{ matrix.season }}
      NFLVERSE_UPDATE_TYPE: ${{ matrix.type }}
      # timestamps are uploaded once per run by the upload_timestamps job
      NFLVERSE_UPLOAD_TIMESTAMPS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://nflverse.r-universe.dev'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            nflverse/nflverse-data
            nflverse/fastrmodels
      - name: Release ${{ matrix.type }}
        run: Rscript -e 'source("exec/update_data.R")'

  # Upload timestamp.txt and timestamp.json once per release instead of once per
  # matrix job. A release gets a new timestamp if at least one of its data files
  # was updated during this run, i.e. at least one job for it succeeded.
  upload_timestamps:
    needs: [pbp_setup, update_pbp, update_stats]
    if: ${{ !cancelled() && needs.pbp_setup.result == 'success' }}
    name: Upload release timestamps
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.NFLVERSE_GH_TOKEN }}
      STARTED_AT: ${{ needs.pbp_setup.outputs.started_at }}
      PBP_TYPES: ${{ needs.pbp_setup.outputs.pbp_types }}
      RUN_STATS: ${{ needs.pbp_setup.outputs.run_stats }}
    steps:
      - name: Upload release timestamps
        run: |
          set -euo pipefail

          # Same format as nflversedata::nflverse_upload(), i.e.
          # format(Sys.time(), tz = nflreadr::nflverse_data_timezone, usetz = TRUE)
          now=$(TZ=America/Toronto date '+%Y-%m-%d %H:%M:%S %Z')
          dir=$(mktemp -d)
          printf '%s\n' "$now" > "$dir/timestamp.txt"
          printf '{"last_updated":"%s"}\n' "$now" > "$dir/timestamp.json"

          # "repo tag" of every release this run writes to
          types=$(jq -r '.[] | split(",")[]' <<< "$PBP_TYPES")
          releases=()
          if grep -qx pbp <<< "$types"; then releases+=("nflverse/nflverse-data pbp"); fi
          if grep -qx pbp_stats <<< "$types"; then releases+=("nflverse/nflverse-pbp playstats"); fi
          if [ "$RUN_STATS" == "true" ]; then
            releases+=("nflverse/nflverse-data stats_player" "nflverse/nflverse-data stats_team")
          fi

          for release in "${releases[@]}"; do
            read -r repo tag <<< "$release"
            id=$(gh api "repos/$repo/releases/tags/$tag" --jq .id)
            # data assets (not timestamps) uploaded since this run started
            updated=$(gh api --paginate "repos/$repo/releases/$id/assets?per_page=100" \
              --jq "[.[] | select((.name | startswith(\"timestamp.\") | not) and .updated_at >= \"$STARTED_AT\")] | length" \
              | awk '{ n += $1 } END { print n + 0 }')

            if [ "$updated" -eq 0 ]; then
              echo "::warning::No file in $repo@$tag was updated in this run. Keeping its timestamp."
              continue
            fi

            # retry random GitHub server errors
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$dir/timestamp.txt" "$dir/timestamp.json" -R "$repo" --clobber; then
                echo "Updated timestamp of $repo@$tag ($updated files updated in this run): $now"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Failed to upload timestamps to $repo@$tag"
                exit 1
              fi
              sleep $(( attempt * 30 ))
            done
          done
